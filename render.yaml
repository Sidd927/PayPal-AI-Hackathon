# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: New → Blueprint → select this repo. Fill in the secret env vars in the dashboard.
# Persistence: free instances have an ephemeral disk. PayPal remains the source of truth and the app re-syncs
# on first load, but the audit log and agent-run history reset on restart. For persistence, upgrade to a paid
# instance, add a disk mounted at /var/data, and set DATABASE_PATH=/var/data/unstuck.db.
# Scheduling: a Render cron job (paid) can POST /api/agent/run with "Authorization: Bearer $AGENT_RUN_TOKEN".
services:
  - type: web
    name: unstuck
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DEMO_PAYER_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_EFFORT
        value: medium
      - key: AI_DAILY_CALL_LIMIT
        value: "300"
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_PATH
        value: /tmp/unstuck.db
      - key: OWNER_BASIC_AUTH
        sync: false
      - key: AGENT_RUN_TOKEN
        sync: false
      - key: NEXT_PUBLIC_AG_GRID_LICENSE_KEY
        sync: false
